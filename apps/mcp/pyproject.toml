[project]
name = "kb-mcp"
version = "0.1.0"
description = "MCP server: the knowledge base's retrieval as tools any MCP client or agent can call"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kb-core",
    "mcp>=2.3",
]

[project.scripts]
kb-mcp = "kb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
