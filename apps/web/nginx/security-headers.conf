# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own, so the headers live in one file instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Scripts only from this origin. connect-src allows Cognito: token exchange and refresh
# are fetch calls from the browser. Inline styles are allowed for React style props.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com https://*.amazonaws.com; form-action 'self' https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
