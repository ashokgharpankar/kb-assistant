# SonarQube Cloud analysis settings. Read by the scan step in .github/workflows/ci.yml.
# Check both keys in SonarQube Cloud: Administration > Organization (organization key)
# and your project's Information page (project key).
sonar.organization=ashokgharpankar
sonar.projectKey=ashokgharpankar_kb-assistant
sonar.projectName=kb-assistant

# What to analyse. Terraform is included: Sonar checks IaC for security issues too.
sonar.sources=apps/api/src,packages/kb_core/src,scripts,infra/terraform
sonar.tests=apps/api/tests,packages/kb_core/tests
sonar.exclusions=**/__pycache__/**,**/.terraform/**

sonar.python.version=3.12
# Produced by `pytest --cov --cov-report=xml` in CI (paths relative to the repo root).
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8

# Web UI (Phase 2b): not analysed yet. When SonarQube is switched on, add
# apps/web/src to sonar.sources, exclude **/*.test.ts(x) from sources and include them
# as tests, set sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
# (add "lcov" to the Vitest coverage reporters), and run the scan after both test jobs.
