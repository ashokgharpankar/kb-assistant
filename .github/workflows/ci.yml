name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token. No AWS credentials are needed in Phase 0:
# everything here is static checking. Deploy jobs (with OIDC) arrive in Phase 6.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # A real Postgres + pgvector for the integration tests, same image as local dev.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_ci_only
          POSTGRES_DB: kb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KB_TEST_DATABASE_URL: postgresql://kb:kb_ci_only@localhost:5432/kb
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: SonarQube uses it to tell new code from old
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      # Runs only when the SONAR_TOKEN secret exists (it doesn't on forks' PRs).
      - name: SonarQube Cloud scan and quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        with:
          # Fail this job if the quality gate fails, so a red gate blocks the merge.
          args: >
            -Dsonar.qualitygate.wait=true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      # Fail on known high or critical vulnerabilities in what ships to browsers.
      - run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
          tflint --chdir=infra/terraform/bootstrap
      - name: validate dev
        run: |
          terraform -chdir=infra/terraform/envs/dev init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/dev validate
          tflint --chdir=infra/terraform/envs/dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Misconfigurations in Terraform and Dockerfiles (Phase 6a). Accepted findings are
  # skipped inline with a reason (#checkov:skip=...), so every exception is reviewed.
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: checkov
        run: >
          uvx checkov==3.4.11 -d . --framework terraform dockerfile
          --compact --quiet --skip-path .venv --skip-path node_modules
      # The Helm chart (Phase 6b): lint, render, validate against the Kubernetes schemas,
      # then checkov's Kubernetes rules on what would actually be applied.
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      - name: Helm chart
        run: make helm-check

  # Build, scan and (on main) publish the container images (Phase 6a).
  images:
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push step, which runs on main only
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
      # Trivy runs from a pinned image, not the trivy GitHub Action: in March 2026 that
      # action's version tags were force-pushed to credential-stealing code
      # (CVE-2026-33634). Pin by digest for full protection (see docs/phase-6a-containers.md).
      TRIVY: aquasec/trivy:0.72.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true # into the local Docker, so trivy can scan it before anything is pushed
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan for vulnerabilities (fail on fixable HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --no-progress "$IMAGE:${{ github.sha }}"
      - name: Software bill of materials (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$TRIVY" image --format cyclonedx --output /out/${{ matrix.image }}.cdx.json \
            --no-progress "$IMAGE:${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/${{ matrix.image }}.cdx.json
      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
