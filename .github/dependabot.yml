# Weekly dependency update pull requests. Each PR runs the full CI, including the
# SonarQube quality gate, so an upgrade only merges if everything still passes.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days after a release: most broken releases are fixed or yanked by then.
    cooldown:
      default-days: 5
    groups:
      # One PR for all minor/patch updates instead of one per package.
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap"
      - "/infra/terraform/envs/dev"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      terraform-providers:
        patterns: ["*"]
