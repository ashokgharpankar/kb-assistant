[project]
name = "kb-core"
version = "0.1.0"
description = "Shared library: settings, pricing, loaders, chunking, vector store and the RAG pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # >=1.42.21 + awscrt>=0.30 are needed for `aws login` credentials to auto-refresh
    "boto3>=1.42.21",
    "awscrt>=0.30.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-ollama>=1.0",
    "langchain-aws>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "pymupdf>=1.26",
    "typer>=0.15",
    "httpx>=0.28",
    "numpy>=2",
    "langfuse>=5",
    "psycopg-pool>=3.2",
    "flashrank>=0.2.10",
    "langgraph>=1.2",
]

[project.scripts]
kb = "kb_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]
