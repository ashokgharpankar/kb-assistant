[project]
name = "kb-core"
version = "0.1.0"
description = "Shared library: settings, pricing, and (from Phase 1) the RAG pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # >=1.42.21 + awscrt>=0.30 are needed for `aws login` credentials to auto-refresh
    "boto3>=1.42.21",
    "awscrt>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]
