# Recording rules and alerts for the knowledge assistant (Phase 7a).
# Tested with `make obs-check` (promtool check + unit tests in ../tests/kb-assistant.test.yml).
#
# SLO used here: 99% of answers complete without an error, over 30 days.
# Error budget = 1%. Burn rate = how fast that budget is being spent
# (1 = exactly on budget; 14.4 = a 30-day budget gone in about 2 days).

groups:
  - name: kb-assistant.recording
    rules:
      - record: kb:answers:rate5m
        expr: sum(rate(kb_answers_total[5m]))

      # Cancelled streams (the user pressed Stop or closed the tab) are excluded from the
      # denominator: not a fault, and the request never got a result to judge.
      # "or vector(0)": with no errors yet there is no error series at all, and the
      # ratio would be empty ("No data") instead of 0%.

      - record: kb:answer_errors:ratio_rate5m
        expr: (sum(rate(kb_answers_total{outcome="error"}[5m])) or vector(0)) / sum(rate(kb_answers_total{outcome!="cancelled"}[5m]))
      - record: kb:answer_errors:ratio_rate30m
        expr: (sum(rate(kb_answers_total{outcome="error"}[30m])) or vector(0)) / sum(rate(kb_answers_total{outcome!="cancelled"}[30m]))
      - record: kb:answer_errors:ratio_rate1h
        expr: (sum(rate(kb_answers_total{outcome="error"}[1h])) or vector(0)) / sum(rate(kb_answers_total{outcome!="cancelled"}[1h]))
      - record: kb:answer_errors:ratio_rate6h
        expr: (sum(rate(kb_answers_total{outcome="error"}[6h])) or vector(0)) / sum(rate(kb_answers_total{outcome!="cancelled"}[6h]))

      - record: kb:answer_refusals:ratio_rate30m
        expr: |
          (sum(rate(kb_answers_total{outcome=~"refused|below_floor|blocked"}[30m])) or vector(0))
          / sum(rate(kb_answers_total{outcome!~"error|cancelled|over_budget"}[30m]))

      - record: kb:answer_ttft_seconds:p95_rate5m
        expr: histogram_quantile(0.95, sum by (le) (rate(kb_answer_time_to_first_token_seconds_bucket[5m])))
      - record: kb:answer_duration_seconds:p95_rate5m
        expr: histogram_quantile(0.95, sum by (le) (rate(kb_answer_duration_seconds_bucket[5m])))

      # Phase 7b: share of answered claims backed by their cited sources (lexical check).
      - record: kb:answer_grounding:mean_rate1h
        expr: sum(rate(kb_answer_grounding_score_sum[1h])) / sum(rate(kb_answer_grounding_score_count[1h]))

      - record: kb:llm_cost_usd:per_hour
        expr: sum(rate(kb_llm_cost_usd_total[1h])) * 3600
      - record: kb:llm_cost_usd:per_answer_1h
        expr: sum(rate(kb_llm_cost_usd_total[1h])) / sum(rate(kb_answers_total{outcome=~"answered|refused"}[1h]))

      # Phase 8a answer cache: share of lookups answered without a model call, and what
      # that avoided. (Hit ratio is "no data" until the first lookup, which is honest.)
      - record: kb:cache_hit:ratio_rate1h
        expr: sum(rate(kb_cache_requests_total{result!="miss"}[1h])) / sum(rate(kb_cache_requests_total[1h]))
      - record: kb:cache_saved_usd:per_hour
        expr: sum(rate(kb_cache_saved_usd_total[1h])) * 3600

      # Phase 8b routing: share of model answers that needed the larger model. A rise
      # means the small model is struggling (new documents, a model change) and costs grow.
      - record: kb:escalations:ratio_rate1h
        expr: |
          (sum(rate(kb_escalations_total[1h])) or vector(0))
          / sum(rate(kb_answers_total{outcome=~"answered|refused"}[1h]))

  - name: kb-assistant.alerts
    rules:
      - alert: KbApiDown
        expr: up{job="kb-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "The API isn't answering Prometheus scrapes"
          runbook: "docker compose ps; make app-logs; is the API container healthy?"

      # Multi-window, multi-burn-rate alerts (Google SRE workbook). The long window
      # proves it's real; the short window proves it's still happening, so the alert
      # clears quickly after a fix.
      - alert: KbErrorBudgetFastBurn
        expr: |
          kb:answer_errors:ratio_rate1h > (14.4 * 0.01)
          and kb:answer_errors:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Answers are failing fast enough to spend the 30-day error budget in ~2 days"
          runbook: "Check the API logs for 'ask failed' / 'stream failed'; model provider and database first."

      - alert: KbErrorBudgetSlowBurn
        expr: |
          kb:answer_errors:ratio_rate6h > (6 * 0.01)
          and kb:answer_errors:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Answers are failing fast enough to spend the 30-day error budget in ~5 days"

      - alert: KbSlowFirstToken
        # 10 s suits a local 3B model on a laptop; set ~3 s for a hosted model.
        expr: kb:answer_ttft_seconds:p95_rate5m > 10 and kb:answers:rate5m > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "p95 time to first token is {{ $value | humanizeDuration }}"
          runbook: "Retrieval time (kb_retrieval_duration_seconds) or the model? Check the trace in Langfuse."

      - alert: KbRefusalRatioHigh
        # Many "not found" answers: questions outside the knowledge base, a retrieval
        # regression, or a broken index. Needs a minimum volume to mean anything.
        expr: |
          kb:answer_refusals:ratio_rate30m > 0.5
          and sum(increase(kb_answers_total{outcome!~"error|cancelled|over_budget"}[30m])) >= 10
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of answers in 30 min were refusals"
          runbook: "Compare kb_retrieval_top_similarity with last week; run make eval."

      - alert: KbGroundingLow
        # Answers drifting away from their sources: a model or prompt change, or new
        # documents the retrieval doesn't find. Minimum volume, like the refusal alert.
        expr: |
          kb:answer_grounding:mean_rate1h < 0.6
          and sum(increase(kb_answer_grounding_score_count[1h])) >= 10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of answer claims are backed by their cited sources"
          runbook: "Look at recent traces (guardrail.grounding span); run make eval and compare answer.grounding_score."

      - alert: KbModelCostHigh
        expr: kb:llm_cost_usd:per_hour > 0.5
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Model spend is running at ${{ $value | printf \"%.2f\" }} per hour"
          runbook: "Which model (kb_llm_cost_usd_total by model)? Unusual traffic? AWS Budgets is the backstop."

      # Phase 8b spend cap. AWS Budgets is hours late and only alerts; these fire on the
      # app's own cap, which is enforced before every model call.
      - alert: KbSpendCapReached
        # Users get "limit reached" instead of answers: a deliberate outage, still an outage.
        expr: sum(increase(kb_answers_total{outcome="over_budget"}[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "The daily spend cap is reached: questions get \"limit reached\" instead of answers"
          runbook: "Real traffic or abuse (per-user counts in the API log)? Raise KB_DAILY_BUDGET_USD only on purpose; it resets at 00:00 UTC."

      - alert: KbSpendEconomyMode
        expr: sum(increase(kb_answers_degraded_total{level="economy"}[30m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Over the soft spend limit: routing is off, the small model answers alone"
          runbook: "Check kb_llm_cost_usd_total by model and kb:escalations:ratio_rate1h; is the cap set right for today's traffic?"

      - alert: KbEscalationRateHigh
        expr: |
          kb:escalations:ratio_rate1h > 0.3
          and sum(increase(kb_answers_total{outcome=~"answered|refused"}[1h])) >= 20
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of answers needed the larger model"
          runbook: "The small model is refusing with good evidence: new documents, a prompt or model change? Run make eval."
