# Unit tests for the alert rules: `make obs-check` runs `promtool test rules` on this file.
# Each series is a synthetic timeline: "a+bxN" means start at a, add b per step, N steps.
rule_files:
  - ../rules/kb-assistant.yml

evaluation_interval: 1m

tests:
  - name: API down for 3 minutes pages; a 1-minute blip doesn't
    interval: 1m
    input_series:
      - series: 'up{job="kb-api",instance="api:8000"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: KbApiDown
        exp_alerts: []
      - eval_time: 5m
        alertname: KbApiDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: kb-api
              instance: api:8000
            exp_annotations:
              summary: "The API isn't answering Prometheus scrapes"
              runbook: "docker compose ps; make app-logs; is the API container healthy?"

  - name: 20% of answers failing for an hour burns the budget fast
    interval: 1m
    input_series:
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+8x90"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="error"}'
        values: "0+2x90"
    alert_rule_test:
      - eval_time: 75m
        alertname: KbErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Answers are failing fast enough to spend the 30-day error budget in ~2 days"
              runbook: "Check the API logs for 'ask failed' / 'stream failed'; model provider and database first."

  - name: 0.5% errors is within budget; no alert
    interval: 1m
    input_series:
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+199x90"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="error"}'
        values: "0+1x90"
    alert_rule_test:
      - eval_time: 75m
        alertname: KbErrorBudgetFastBurn
        exp_alerts: []

  - name: Refusals need volume before they alert
    interval: 1m
    input_series:
      # 2 answers in 40 minutes, both refused: 100%, but too few to mean anything.
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="refused"}'
        values: "0x20 1x20 2x20"
    alert_rule_test:
      - eval_time: 55m
        alertname: KbRefusalRatioHigh
        exp_alerts: []

  - name: Most answers refused, with enough volume, raises a ticket
    interval: 1m
    input_series:
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+1x60"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="refused"}'
        values: "0+3x60"
    alert_rule_test:
      - eval_time: 55m
        alertname: KbRefusalRatioHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "75% of answers in 30 min were refusals"
              runbook: "Compare kb_retrieval_top_similarity with last week; run make eval."

  - name: No errors at all reads as 0%, not "no data"
    interval: 1m
    input_series:
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+5x70"
    promql_expr_test:
      - expr: kb:answer_errors:ratio_rate1h
        eval_time: 65m
        exp_samples:
          - labels: 'kb:answer_errors:ratio_rate1h'
            value: 0

  - name: Weakly grounded answers raise a ticket once there's volume
    interval: 1m
    input_series:
      # 1 answer a minute, each with grounding 0.4.
      - series: 'kb_answer_grounding_score_sum'
        values: "0+0.4x90"
      - series: 'kb_answer_grounding_score_count'
        values: "0+1x90"
    alert_rule_test:
      - eval_time: 80m
        alertname: KbGroundingLow
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "Only 40% of answer claims are backed by their cited sources"
              runbook: "Look at recent traces (guardrail.grounding span); run make eval and compare answer.grounding_score."

  - name: Cache hit ratio counts exact and semantic hits against all lookups
    interval: 1m
    input_series:
      # Each minute: 2 exact hits, 1 semantic hit, 1 miss -> 75% hit ratio.
      - series: 'kb_cache_requests_total{result="exact"}'
        values: "0+2x90"
      - series: 'kb_cache_requests_total{result="semantic"}'
        values: "0+1x90"
      - series: 'kb_cache_requests_total{result="miss"}'
        values: "0+1x90"
    promql_expr_test:
      - expr: kb:cache_hit:ratio_rate1h
        eval_time: 80m
        exp_samples:
          - labels: 'kb:cache_hit:ratio_rate1h'
            value: 0.75

  - name: Cancelled streams don't spend the error budget
    interval: 1m
    input_series:
      # Each minute: 9 answered, 1 error, and 40 users pressing Stop. Error ratio is
      # 1/10 = 10%, not 1/50 = 2% (diluted) and not 41/50 (cancellations as errors).
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+9x70"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="error"}'
        values: "0+1x70"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="cancelled"}'
        values: "0+40x70"
    promql_expr_test:
      - expr: kb:answer_errors:ratio_rate1h
        eval_time: 65m
        exp_samples:
          - labels: 'kb:answer_errors:ratio_rate1h'
            value: 0.1

  - name: Routing - escalation ratio over model answers, and the alert's volume guard
    interval: 1m
    input_series:
      # Each minute: 8 answered, 2 refused, 4 escalations -> 40%.
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+8x120"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="refused"}'
        values: "0+2x120"
      - series: 'kb_escalations_total{from_model="llama3.2",to_model="qwen2.5:7b",result="answered"}'
        values: "0+4x120"
    promql_expr_test:
      - expr: kb:escalations:ratio_rate1h
        eval_time: 65m
        exp_samples:
          - labels: 'kb:escalations:ratio_rate1h'
            value: 0.4
    alert_rule_test:
      - eval_time: 100m
        alertname: KbEscalationRateHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "40% of answers needed the larger model"
              runbook: "The small model is refusing with good evidence: new documents, a prompt or model change? Run make eval."

  - name: Spend cap - over_budget pages, and isn't counted as a refusal
    interval: 1m
    input_series:
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="answered"}'
        values: "0+10x40"
      - series: 'kb_answers_total{endpoint="stream",mode="pipeline",outcome="over_budget"}'
        values: "0x20 0+5x20"
    promql_expr_test:
      - expr: kb:answer_refusals:ratio_rate30m
        eval_time: 40m
        exp_samples:
          - labels: 'kb:answer_refusals:ratio_rate30m'
            value: 0
    alert_rule_test:
      - eval_time: 15m
        alertname: KbSpendCapReached
        exp_alerts: []
      - eval_time: 30m
        alertname: KbSpendCapReached
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "The daily spend cap is reached: questions get \"limit reached\" instead of answers"
              runbook: "Real traffic or abuse (per-user counts in the API log)? Raise KB_DAILY_BUDGET_USD only on purpose; it resets at 00:00 UTC."
