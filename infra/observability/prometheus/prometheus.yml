# Prometheus for the local stack (Phase 7a). Scrapes the API container started by
# `make app-up`; started with `make obs-up`. Check with `make obs-check`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kb-api
    metrics_path: /metrics
    static_configs:
      # The API container on the Compose network. /metrics is served on the API port
      # only; nginx (the web container) doesn't route it.
      - targets: ["api:8000"]
        labels:
          service: kb-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
