# Metrics for the local stack (Phase 7a): Prometheus scrapes the API, Grafana shows
# the dashboard. Used together with docker-compose.app.yml so both share one network:
#   make obs-up     (Prometheus http://localhost:9095, Grafana http://localhost:3001)
# Grafana uses 3001 because Langfuse already has 3000; Prometheus 9095 because
# Langfuse's MinIO usually holds 9090.

services:
  prometheus:
    image: prom/prometheus:v3.13.5 # LTS line, supported until 2027-07-31
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle # lets `make obs-reload` reload rules without a restart
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9095}:9090" # 9090 is often taken (Langfuse's MinIO)
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local convenience: dashboards open without signing in, read-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/kb-assistant-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
