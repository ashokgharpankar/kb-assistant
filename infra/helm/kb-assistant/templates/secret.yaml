{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  KB_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password .Release.Name .Values.postgres.database | quote }}
  {{- else }}
  KB_DATABASE_URL: {{ required "externalDatabaseUrl is required when postgres.enabled=false" .Values.externalDatabaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.langfusePublicKey }}
  KB_LANGFUSE_PUBLIC_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.langfuseSecretKey }}
  KB_LANGFUSE_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
