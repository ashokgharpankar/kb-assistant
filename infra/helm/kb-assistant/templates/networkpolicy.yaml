{{- if .Values.networkPolicy.enabled }}
# Who may connect to whom, inside the cluster:
#   web       <- anyone (it's the public entry point, via the NodePort)
#   api       <- web only (nothing else needs the API directly)
#   postgres  <- api only
# Egress isn't restricted: the API must reach Ollama on the host and Cognito's keys.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kb.selector" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports: # from anywhere, but only to nginx's port
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kb.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kb.selector" (dict "ctx" . "component" "web") | nindent 14 }}
      ports:
        - port: 8000
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kb.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kb.selector" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- end }}
