{{- $component := "api" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if eq .Values.api.env.KB_AUTH_MODE "cognito" }}
  KB_COGNITO_USER_POOL_ID: {{ required "api.cognito.userPoolId is required when KB_AUTH_MODE=cognito" .Values.api.cognito.userPoolId | quote }}
  KB_COGNITO_CLIENT_ID: {{ required "api.cognito.clientId is required when KB_AUTH_MODE=cognito" .Values.api.cognito.clientId | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  annotations:
    # checkov findings accepted after review (Phase 6b, ADR 0023):
    checkov.io/skip1: CKV_K8S_11=No CPU limit on purpose - limits throttle bursty request handling; requests and a memory limit are set
    checkov.io/skip2: CKV_K8S_43=Local kind images are loaded, not pulled, so there is no registry digest; AWS deploys pin digests (6c)
    checkov.io/skip3: CKV_K8S_15=IfNotPresent is required for images loaded into kind; AWS deploys use immutable digests (6c)
    checkov.io/skip4: CKV_K8S_35=The app reads its settings from environment variables; reading secrets from files is backlog
  labels:
    {{- include "kb.labels" . | nindent 4 }}
    {{- include "kb.selector" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "kb.selector" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kb.selector" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the pods when settings change (env vars are only read at start-up).
        checksum/config: {{ toJson .Values.api | sha256sum }}
    spec:
      automountServiceAccountToken: false # the API never talks to Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api
            - secretRef:
                name: {{ .Release.Name }}-secrets
          securityContext:
            {{- include "kb.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          # Start-up can take a while (imports); liveness only starts once it has passed.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kb.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kb.selector" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
